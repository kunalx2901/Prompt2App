version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: prompt2app-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend


volumes:
  frontend_node_modules:
  backend_node_modules: