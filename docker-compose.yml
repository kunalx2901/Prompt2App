version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: prompt2app-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    image: node:20
    container_name: prompt2app-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "8787:8787"
    command: sh -c "npm install && npx wrangler dev --ip 0.0.0.0 --port 8787 --local"
    environment:
      - CLOUDFLARE_API_TOKEN=your_cloudflare_token_here

volumes:
  frontend_node_modules:
  backend_node_modules: